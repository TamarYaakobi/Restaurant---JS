
    <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>בדיחה ב-HTML</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom right, #fdf6e3, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Arial', sans-serif;
    }

    .container {
      max-width: 80%;
      font-size: 2.5rem;
      color: #333;
      background-color: #ffffffcc;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .container {
        font-size: 1.8rem;
      }
      .emoji {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">😩💻</span>
    נראה לכם שהיה לנו כח לייצר עוד דפים?
    <br>
    <span class="emoji">🛏️➡️🍕➡️📺</span>
"אנחנו בהפסקת חשיבה. נחזור אחרי שניזכר איך כותבים קוד 🧠💤"

  </div>
</body>
</html>
